#####################################################################
# FLY-LLL PLUS Buffer Standalone Integration
#####################################################################
# Universal buffer integration for FLY-LLL PLUS Buffer
#
# Features:
# - BUFFER_UNLOAD_FILAMENT: Complete unload with buffer retraction
# - BUFFER_LOAD_FILAMENT: Complete load with automatic engagement
# - Auto-homing if printer not homed
# - Temperature management
# - Parking position for safe filament changes
# - Buffer retraction until runout sensor detects no filament
#####################################################################

#####################################################################
# Configuration Variables
#####################################################################
# All user-configurable variables have been moved to mellow_buffer_user_settings.cfg
# This file should be copied outside the tracked folder for editing when using Moonraker.
# See mellow_buffer_user_settings.cfg for configuration instructions.
#####################################################################

#####################################################################
# BUFFER_UNLOAD_FILAMENT - Standalone Unload with Buffer Integration
#####################################################################
# Complete filament unload macro with buffer retraction
#
# Parameters:
#   TEMP: Unload temperature in °C (default: 250)
#   SPEED: Unload speed in mm/s (default: from variable_unload_speed)
#   COOL: Cool down after unload? 'Yes'/'No' (default: from variable_cooldown)
#   COOL_TEMP: Cool down temperature in °C (default: from variable_cooldown_temp)
#   UNLOAD_LENGTH: Override unload length in mm (auto-calculated as hotend_path_length + 10mm if not specified)
#
# Usage:
#   BUFFER_UNLOAD_FILAMENT
#   BUFFER_UNLOAD_FILAMENT TEMP=230
#   BUFFER_UNLOAD_FILAMENT TEMP=230 SPEED=5
#####################################################################

[gcode_macro BUFFER_UNLOAD_FILAMENT]
description: Unload filament from hotend and retract buffer until runout detected
gcode:
    # Check if user settings are loaded. action_raise_error fires while the
    # template renders, so nothing in this macro runs and any RESPOND lines
    # before it are never shown - keep all guidance inside the error text.
    {% if "gcode_macro _BUFFER_USER_SETTINGS" not in printer %}
        { action_raise_error("Buffer: _BUFFER_USER_SETTINGS not found. Include mellow_buffer_user_settings.cfg in printer.cfg.") }
    {% endif %}
    
    # Get configuration from buffer user settings
    {% set buffer_vars = printer["gcode_macro _BUFFER_USER_SETTINGS"] %}
    {% set park_x = buffer_vars.park_x|float %}
    {% set park_y = buffer_vars.park_y|float %}
    {% set park_min_z = buffer_vars.park_min_z|float %}
    {% set unload_purge_length = buffer_vars.unload_purge_length|float %}
    {% set default_temp = buffer_vars.unload_temp|int %}
    {% set default_speed = buffer_vars.unload_speed|float %}
    {% set default_cooldown = buffer_vars.cooldown|string %}
    {% set default_cooldown_temp = buffer_vars.cooldown_temp|int %}
    {% set hotend_path_length = buffer_vars.hotend_path_length|float %}
    {% set buffer_startup_delay = buffer_vars.buffer_startup_delay|float %}
    {% set buffer_pulse_interval = buffer_vars.buffer_pulse_interval|float %}
    {% set buffer_pulse_duration = buffer_vars.buffer_pulse_duration|float %}
    
    # Auto-calculate unload_length: hotend_path_length + small margin (filament releases at ~hotend_path_length)
    {% set calculated_unload_length = hotend_path_length + 10.0 %}
    
    # Allow parameter overrides
    {% set temp = params.TEMP|default(default_temp)|int %}
    {% set speed_mmsec = params.SPEED|default(default_speed)|float %}
    {% set speed = speed_mmsec * 60 %}  # Convert to mm/min
    {% set cool = params.COOL|default(default_cooldown)|string %}
    {% set cool_temp = params.COOL_TEMP|default(default_cooldown_temp)|int %}
    {% set override_unload_length = params.UNLOAD_LENGTH|default(0)|float %}
    {% if override_unload_length > 0 %}
        {% set unload_length = override_unload_length %}
    {% else %}
        {% set unload_length = calculated_unload_length %}
    {% endif %}
    
    # Get max velocity from extruder config and ensure speed doesn't exceed it
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity|int * 60 %}
    {% if speed > max_velocity %}
        {% set speed = max_velocity %}
    {% endif %}
    
    RESPOND MSG="BUFFER_UNLOAD_FILAMENT starting..."
    RESPOND MSG="Park: X={park_x} Y={park_y} Z_min={park_min_z}"
    RESPOND MSG="Unload: {unload_length}mm | Purge: {unload_purge_length}mm | Temp: {temp}°C | Speed: {speed_mmsec}mm/s"
    
    # Save G-code state
    SAVE_GCODE_STATE NAME=buffer_unload_state
    
    # Step 1: Auto-home if not homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Printer not homed - auto-homing before unload..."
        SET_DISPLAY_TEXT MSG="Homing..."
        G28  # Home all axes
        M400  # Wait for homing to complete
        RESPOND MSG="Homing complete - proceeding with unload"
    {% endif %}
    
    # Step 2: Park toolhead (only if not printing/paused)
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        # Raise Z if needed
        {% if printer.toolhead.position.z|float < park_min_z|float %}
            G90
            G0 Z{park_min_z|float} F3600
            M400
        {% endif %}
        
        # Move to park position
        G90
        G0 X{park_x|float} Y{park_y|float} F9000
        M400
        RESPOND MSG="Toolhead parked at X={park_x} Y={park_y}"
    {% endif %}
    
    # Step 3: Temperature management
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        {% if 'TEMP' not in params %}
            {% if (printer.extruder.target == 0) or (printer.extruder.target < printer.configfile.settings['extruder'].min_extrude_temp) %}
                SET_DISPLAY_TEXT MSG="Unload hotend heating..."
                RESPOND MSG="Unload hotend heating to {temp}°C..."
                SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp|int -2} MAXIMUM={temp|int + 5}
                M117
            {% elif printer.extruder.target != 0 and printer.extruder.target >= printer.configfile.settings['extruder'].min_extrude_temp %}
                SET_DISPLAY_TEXT MSG="Unloading hotend..."
                RESPOND MSG="Unloading hotend at {printer.extruder.target|int}°C..."
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={printer.extruder.target|int -2} MAXIMUM={printer.extruder.target|int + 5}
            {% endif %}
        {% else %}
            SET_DISPLAY_TEXT MSG="Unload hotend heating to {temp}°C"
            RESPOND MSG="Unload hotend heating to {temp}°C"
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp|int -2} MAXIMUM={temp|int + 5}
        {% endif %}
    {% endif %}
    
    # Step 4: Unload filament from hotend
    RESPOND MSG="Starting filament unload from hotend..."
    M83  # Relative extrusion
    G92 E0  # Reset extruder
    
    # Purge to prevent cold end clogging
    RESPOND MSG="Purging {unload_purge_length}mm to clear cold end..."
    G1 E{unload_purge_length|float} F{speed|int}
    M400
    
    # Small retract to break adhesion
    G1 E-5 F{speed|int}
    M400
    
    # Simplified retraction: pull partway through hotend, then start buffer and continue
    # Initial retraction: 40% of hotend path (pulls filament partway through extruder grip)
    {% set initial_retract_pct = 0.40 %}  # 40% of hotend path
    {% set initial_retract_length = hotend_path_length * initial_retract_pct %}
    {% set remaining_retract_length = unload_length - initial_retract_length - 5.0 %}  # Subtract small retract
    
    # Phase 1: Initial retraction (filament still gripped by extruder)
    RESPOND MSG="Phase 1: Initial retraction {initial_retract_length|round(1)}mm (filament still gripped)..."
    G1 E-{initial_retract_length|float} F{speed|int}
    M400  # Wait for initial retraction to complete
    
    # Brief delay for buffer motor startup (filament still gripped, buffer will help pull)
    {% set delay_ms = (buffer_startup_delay * 1000) | int %}
    G4 P{delay_ms}  # Brief delay for buffer startup
    
    # Calculate pulse duration (used in Phase 2/3 and Phase 4)
    {% set pulse_duration_ms = (buffer_pulse_duration * 1000) | int %}
    
    # Phase 2 & 3: Smart pulsing buffer retraction (parallel with remaining hotend retraction)
    # Buffer pulses in bursts to take up slack while extruder pulls continuously
    {% if remaining_retract_length > 0 %}
        RESPOND MSG="Phase 2: Smart pulsing buffer retraction (pulses every {buffer_pulse_interval|round(1)}mm, {buffer_pulse_duration|round(2)}s per pulse)..."
        RESPOND MSG="Phase 3: Continuing hotend retraction {remaining_retract_length|round(1)}mm (buffer pulsing in parallel, filament will release during this phase)..."
        
        # Calculate number of segments based on pulse interval
        {% set num_segments = (remaining_retract_length / buffer_pulse_interval) | int %}
        {% if num_segments < 1 %}
            {% set num_segments = 1 %}
        {% endif %}
        {% set segment_length = remaining_retract_length / num_segments %}
        
        # Break remaining retraction into segments: move extruder, then pulse buffer to take up slack
        {% for i in range(num_segments) %}
            {% set segment_num = i + 1 %}
            
            # Extruder retracts this segment
            G1 E-{segment_length|float} F{speed|int}
            
            # Pulse buffer after extruder move to take up accumulated slack
            {% if segment_num < num_segments %}
                # Not last segment: pulse buffer to take up slack
                SET_PIN PIN=_Retract_Button VALUE=0  # Buffer on
                G4 P{pulse_duration_ms}  # Pulse duration
                SET_PIN PIN=_Retract_Button VALUE=1  # Buffer off
            {% else %}
                # Last segment: keep buffer on to continue retraction after unload completes
                SET_PIN PIN=_Retract_Button VALUE=0  # Buffer on (continues after unload)
            {% endif %}
        {% endfor %}
        
        M400  # Wait for remaining retraction to complete
    {% else %}
        # No remaining retraction, just start buffer
        RESPOND MSG="Phase 2: Starting buffer retraction..."
        SET_PIN PIN=_Retract_Button VALUE=0  # Press retract button (LOW = pressed)
        M400  # Brief wait to ensure buffer starts
    {% endif %}
    
    # Phase 4: Extra extrude distance for filament stringing (with pulsing)
    {% set filament_tail_extra = buffer_vars.filament_tail_extra_extrude|float %}
    {% if filament_tail_extra > 0 %}
        RESPOND MSG="Phase 4: Extra extrude {filament_tail_extra|round(1)}mm for filament stringing (buffer pulsing continues)..."
        
        # Calculate segments for extra extrude
        {% set extra_num_segments = (filament_tail_extra / buffer_pulse_interval) | int %}
        {% if extra_num_segments < 1 %}
            {% set extra_num_segments = 1 %}
        {% endif %}
        {% set extra_segment_length = filament_tail_extra / extra_num_segments %}
        
        # Extrude extra distance with pulsing
        {% for i in range(extra_num_segments) %}
            {% set extra_segment_num = i + 1 %}
            
            # Extruder retracts this extra segment
            G1 E-{extra_segment_length|float} F{speed|int}
            
            # Pulse buffer after each segment (except last)
            {% if extra_segment_num < extra_num_segments %}
                SET_PIN PIN=_Retract_Button VALUE=0  # Buffer on
                G4 P{pulse_duration_ms}  # Pulse duration
                SET_PIN PIN=_Retract_Button VALUE=1  # Buffer off
            {% else %}
                # Last extra segment: keep buffer on to continue retraction
                SET_PIN PIN=_Retract_Button VALUE=0  # Buffer on (continues after unload)
            {% endif %}
        {% endfor %}
        
        M400  # Wait for extra extrude to complete
    {% endif %}
    
    RESPOND MSG="Hotend unload complete - buffer continuing retraction until runout detected..."
    
    # Step 5: Continue buffer retraction until runout detected
    # Buffer is already retracting, now we just need to monitor and stop when done
    Buffer_Retract_Until_Runout TIMEOUT=90 POLL=2.0 ASSIST=0
    
    # Call nozzle cleaning macro if configured (before cooldown)
    {% set nozzle_clean_macro = buffer_vars.nozzle_clean_macro|string|trim %}
    {% if nozzle_clean_macro and nozzle_clean_macro != "" %}
        RESPOND MSG="Running nozzle cleaning: {nozzle_clean_macro}..."
        {% if nozzle_clean_macro == "CLEAN_NOZZLE" %}
            CLEAN_NOZZLE
        {% elif nozzle_clean_macro == "NOZZLE_CLEAN" %}
            NOZZLE_CLEAN
        {% elif nozzle_clean_macro == "CLEAN" %}
            CLEAN
        {% elif nozzle_clean_macro == "NOZZLE_CLEANING" %}
            NOZZLE_CLEANING
        {% else %}
            RESPOND MSG="⚠ Unknown nozzle cleaning macro: {nozzle_clean_macro}"
            RESPOND MSG="Please add it to the conditional check or call it manually"
        {% endif %}
        M400
    {% endif %}
    
    # Step 6: Optional cooldown (last step)
    {% if cool|lower in ['yes', 'true'] %}
        {% if printer.print_stats.state not in ['printing', 'paused'] and (temp >= printer.configfile.settings['extruder'].min_extrude_temp) %}
            SET_DISPLAY_TEXT MSG="Post unload hotend cooling..."
            RESPOND MSG="Post unload hotend cooling to {cool_temp}°C..."
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={cool_temp|int}
            M117
        {% elif printer.print_stats.state in ['printing', 'paused'] %}
            SET_DISPLAY_TEXT MSG="Unload cooling denied, print in progress!"
            RESPOND MSG="Unload cooling denied, print in progress!"
        {% endif %}
    {% endif %}
    
    # Restore G-code state
    RESTORE_GCODE_STATE NAME=buffer_unload_state
    
    M400
    SET_DISPLAY_TEXT MSG="BUFFER_UNLOAD_FILAMENT operation complete!"
    RESPOND MSG="BUFFER_UNLOAD_FILAMENT operation complete!"


#####################################################################
# BUFFER_LOAD_FILAMENT - Standalone Load with Buffer Integration
#####################################################################
# Complete filament load macro: engages the filament the buffer has fed to
# the extruder, advances it through the hotend, purges and retracts.
# Works with or without Demon Klipper Essentials Unified
#
# Parameters:
#   TEMP: Load temperature in °C (default: from variable_load_temp)
#   SPEED: Load speed in mm/s (default: from variable_load_speed)
#   ENGAGE_LENGTH: First move, grabs the filament in the extruder gears, in mm (default: from variable_engage_length)
#   PURGE_LENGTH: Purge length once filament reaches the nozzle, in mm (default: from variable_load_purge_length)
#   RETRACT_LENGTH: Retract length after purge to minimize oozing in mm (default: from variable_load_retract_length)
#   COOL: Cool down after load? 'Yes'/'No' (default: from variable_cooldown)
#   COOL_TEMP: Cool down temperature in °C (default: from variable_cooldown_temp)
#
# Extruder travel before the purge totals hotend_path_length (ENGAGE_LENGTH
# plus the rest of the path), so the purge starts at the nozzle tip.
#
# Note: This macro assumes filament is already at the extruder mouth.
#       The buffer firmware automatically feeds filament when inserted.
#       There is no grip check: the filament sensor is the buffer's HALL
#       output, which stays triggered whether or not the gears have gripped.
#
# Usage:
#   BUFFER_LOAD_FILAMENT
#   BUFFER_LOAD_FILAMENT TEMP=230
#   BUFFER_LOAD_FILAMENT TEMP=230 SPEED=5
#   BUFFER_LOAD_FILAMENT TEMP=230 RETRACT_LENGTH=5
#####################################################################

[gcode_macro BUFFER_LOAD_FILAMENT]
description: Load filament from buffer into hotend and purge
gcode:
    # Check if user settings are loaded (see BUFFER_UNLOAD_FILAMENT for why
    # the guidance lives in the error text)
    {% if "gcode_macro _BUFFER_USER_SETTINGS" not in printer %}
        { action_raise_error("Buffer: _BUFFER_USER_SETTINGS not found. Include mellow_buffer_user_settings.cfg in printer.cfg.") }
    {% endif %}

    # Get configuration from buffer user settings
    {% set buffer_vars = printer["gcode_macro _BUFFER_USER_SETTINGS"] %}
    {% set park_x = buffer_vars.park_x|float %}
    {% set park_y = buffer_vars.park_y|float %}
    {% set park_min_z = buffer_vars.park_min_z|float %}
    {% set load_purge_length = buffer_vars.load_purge_length|float %}
    {% set default_temp = buffer_vars.load_temp|int %}
    {% set default_speed = buffer_vars.load_speed|float %}
    {% set default_retract_length = buffer_vars.load_retract_length|float %}
    {% set default_engage_length = buffer_vars.engage_length|float %}
    {% set default_cooldown = buffer_vars.cooldown|string %}
    {% set default_cooldown_temp = buffer_vars.cooldown_temp|int %}
    {% set hotend_path_length = buffer_vars.hotend_path_length|float %}

    # Allow parameter overrides
    {% set temp = params.TEMP|default(default_temp)|int %}
    {% set speed_mmsec = params.SPEED|default(default_speed)|float %}
    {% set speed = speed_mmsec * 60 %}  # Convert to mm/min
    {% set engage_length = params.ENGAGE_LENGTH|default(default_engage_length)|float %}
    {% set purge_length = params.PURGE_LENGTH|default(load_purge_length)|float %}
    {% set retract_length = params.RETRACT_LENGTH|default(default_retract_length)|float %}
    {% set cool = params.COOL|default(default_cooldown)|string %}
    {% set cool_temp = params.COOL_TEMP|default(default_cooldown_temp)|int %}

    # Rest of the path from the end of the engage move to the nozzle tip
    {% set advance_length = [hotend_path_length - engage_length, 0]|max %}

    # Get max velocity from extruder config and ensure speed doesn't exceed it
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity|int * 60 %}
    {% if speed > max_velocity %}
        {% set speed = max_velocity %}
    {% endif %}

    # Preflight checks. Like the settings check above, these run while the
    # template renders, so an error here stops the macro before it homes,
    # parks or heats anything.
    {% set is_printing = printer.print_stats.state in ['printing', 'paused'] %}
    {% set min_extrude_temp = printer.configfile.settings['extruder'].min_extrude_temp|int %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        { action_raise_error("Buffer: No filament in buffer. Insert filament into the buffer, wait for it to auto-feed to the extruder, then run BUFFER_LOAD_FILAMENT again.") }
    {% endif %}
    {% if is_printing and printer.extruder.temperature < min_extrude_temp %}
        { action_raise_error("Buffer: Print in progress and hotend is " ~ (printer.extruder.temperature|int) ~ "°C, below min_extrude_temp " ~ min_extrude_temp ~ "°C. Heat the hotend and retry.") }
    {% endif %}

    RESPOND MSG="BUFFER_LOAD_FILAMENT starting..."
    RESPOND MSG="Park: X={park_x} Y={park_y} Z_min={park_min_z}"
    RESPOND MSG="Engage: {engage_length}mm | Advance: {advance_length}mm | Purge: {purge_length}mm | Temp: {temp}°C | Speed: {speed_mmsec}mm/s"
    RESPOND MSG="✓ Filament detected at extruder (buffer auto-feeds on insertion)"

    # Save G-code state
    SAVE_GCODE_STATE NAME=buffer_load_state
    
    # Step 1: Auto-home if not homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Printer not homed - auto-homing before load..."
        SET_DISPLAY_TEXT MSG="Homing..."
        G28  # Home all axes
        M400  # Wait for homing to complete
        RESPOND MSG="Homing complete - proceeding with load"
    {% endif %}
    
    # Step 2: Park toolhead (only if not printing/paused)
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        # Raise Z if needed
        {% if printer.toolhead.position.z|float < park_min_z|float %}
            G90
            G0 Z{park_min_z|float} F3600
            M400
        {% endif %}
        
        # Move to park position
        G90
        G0 X{park_x|float} Y{park_y|float} F9000
        M400
        RESPOND MSG="Toolhead parked at X={park_x} Y={park_y}"
    {% endif %}
    
    # Step 3: Heat hotend (required before extruder can move filament)
    {% if not is_printing %}
        RESPOND MSG="Heating hotend to {temp}°C..."
        SET_DISPLAY_TEXT MSG="Heating to {temp}°C..."
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp|int -2} MAXIMUM={temp|int + 5}
        RESPOND MSG="✓ Hotend reached {temp}°C"
    {% else %}
        RESPOND MSG="Print in progress - using current temperature: {printer.extruder.temperature|int}°C"
    {% endif %}

    # Step 4: Engage filament in the extruder gears, then advance it to the nozzle.
    # A single pass: sensor reads inside the template are frozen at render time
    # and the HALL output can't tell whether the gears gripped, so a retry loop
    # has nothing real to test.
    RESPOND MSG="Engaging filament: {engage_length}mm..."
    SET_DISPLAY_TEXT MSG="Engaging filament..."
    M83  # Relative extrusion
    G92 E0  # Reset extruder
    G1 E{engage_length|float} F{speed|int}
    M400

    {% if advance_length > 0 %}
        RESPOND MSG="Advancing filament {advance_length}mm to the nozzle..."
        G1 E{advance_length|float} F{speed|int}
        M400
    {% endif %}

    # Step 5: Purge filament
    RESPOND MSG="Purging {purge_length}mm of filament..."
    SET_DISPLAY_TEXT MSG="Purging filament..."

    M83  # Relative extrusion
    G92 E0  # Reset extruder
    G1 E{purge_length|float} F{speed|int}
    M400

    RESPOND MSG="✓ Purge complete - {purge_length}mm extruded"

    # Step 6: Quick retract to minimize oozing
    RESPOND MSG="Retracting {retract_length}mm at 30mm/sec to minimize oozing..."
    SET_DISPLAY_TEXT MSG="Retracting to prevent ooze..."
    
    G92 E0  # Reset extruder position
    G1 E-{retract_length|float} F1800  # 30mm/sec = 1800 mm/min
    M400
    
    RESPOND MSG="✓ Retract complete - {retract_length}mm retracted"
    
    # Ensure buttons are released
    SET_PIN PIN=_Feed_Button VALUE=1
    SET_PIN PIN=_Retract_Button VALUE=1
    M400
    
    # Restore G-code state
    RESTORE_GCODE_STATE NAME=buffer_load_state
    
    M400
    SET_DISPLAY_TEXT MSG="BUFFER_LOAD_FILAMENT complete!"
    RESPOND MSG="BUFFER_LOAD_FILAMENT operation complete!"
    RESPOND MSG="Filament loaded and ready to print"
    
    # Call nozzle cleaning macro if configured (before cooldown)
    {% set nozzle_clean_macro = buffer_vars.nozzle_clean_macro|string|trim %}
    {% if nozzle_clean_macro and nozzle_clean_macro != "" %}
        RESPOND MSG="Running nozzle cleaning: {nozzle_clean_macro}..."
        {% if nozzle_clean_macro == "CLEAN_NOZZLE" %}
            CLEAN_NOZZLE
        {% elif nozzle_clean_macro == "NOZZLE_CLEAN" %}
            NOZZLE_CLEAN
        {% elif nozzle_clean_macro == "CLEAN" %}
            CLEAN
        {% elif nozzle_clean_macro == "NOZZLE_CLEANING" %}
            NOZZLE_CLEANING
        {% else %}
            RESPOND MSG="⚠ Unknown nozzle cleaning macro: {nozzle_clean_macro}"
            RESPOND MSG="Please add it to the conditional check or call it manually"
        {% endif %}
        M400
    {% endif %}
    
    # Optional cooldown (last step)
    {% if cool|lower in ['yes', 'true'] %}
        {% if printer.print_stats.state not in ['printing', 'paused'] and (temp >= printer.configfile.settings['extruder'].min_extrude_temp) %}
            SET_DISPLAY_TEXT MSG="Post load hotend cooling..."
            RESPOND MSG="Post load hotend cooling to {cool_temp}°C..."
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={cool_temp|int}
            M117
        {% elif printer.print_stats.state in ['printing', 'paused'] %}
            SET_DISPLAY_TEXT MSG="Load cooling denied, print in progress!"
            RESPOND MSG="Load cooling denied, print in progress!"
        {% endif %}
    {% endif %}


#####################################################################
# Buffer_Retract_Until_Runout - Buffer Retraction Helper
#####################################################################
# Retracts filament via buffer until runout sensor detects no filament.
#
# The filament sensor is the buffer's INLET switch, relayed by the buffer
# firmware on PB15. While the retract signal is held LOW, the firmware sits
# in a wait loop and never refreshes PB15 (buffer.cpp motor_control), so
# the sensor stays frozen at "filament present". Retraction therefore runs
# in segments: after each one the retract pin is released briefly, the
# firmware's main loop runs and updates PB15, then retraction resumes.
# Klipper applies debounce_delay (2s) before it sees the change, so the
# motor stops roughly one to two segments after the filament clears.
#
# Uses [delayed_gcode] so each step re-reads the sensor at runtime, not at
# Jinja2 render time.
#
# IMPORTANT: This macro is ASYNCHRONOUS. It starts the motor, schedules
# the first step, then returns immediately. The caller continues while
# the motor runs in the background. Use BUFFER_STOP to cancel early.
#
# Parameters:
#   TIMEOUT: Maximum motor-on (retraction) time in seconds (default: 90 -
#            a full retraction through ~1.3m of PTFE takes ~60s at ~23mm/s)
#   POLL: Seconds of retraction between sensor refreshes (default: 2.0,
#         minimum 1.0 - shorter segments spend most of their time
#         stopping and restarting the motor)
#   ASSIST: Extruder retraction in mm done WHILE the buffer starts pulling
#           (default: variable_unload_assist_length, 0 = off). The buffer
#           doesn't follow the extruder when it pushes filament back, so a
#           long extruder-only retraction bunches filament up in the tube
#           and leaves the end in the gears. With ASSIST, the end leaves
#           the gears while the buffer pulls. Skipped if the hotend is
#           below min_extrude_temp.
#   ASSIST_SPEED: Speed of that retraction in mm/s (default:
#           variable_unload_assist_speed, 18). Keep it a bit below the
#           buffer's ~23mm/s so the filament is pulled taut, never pushed.
#
# Usage: Buffer_Retract_Until_Runout [TIMEOUT=90] [POLL=2.0] [ASSIST=90] [ASSIST_SPEED=18]
#####################################################################

[gcode_macro _Buffer_Retract_State]
# Holds state between delayed_gcode steps.
variable_active: False
variable_retracting: False
variable_time_left: 0.0
variable_timeout: 0.0
variable_segment: 2.0
variable_sensor_disabled: False
gcode:

[gcode_macro Buffer_Retract_Until_Runout]
description: Retract buffer until runout sensor clears (async - motor stops in background)
gcode:
    {% set buffer_vars = printer["gcode_macro _BUFFER_USER_SETTINGS"] if "gcode_macro _BUFFER_USER_SETTINGS" in printer else {} %}
    {% set timeout = params.TIMEOUT|default(90)|float %}
    {% set segment = [params.POLL|default(2.0)|float, 1.0]|max %}
    {% set assist = params.ASSIST|default(buffer_vars.unload_assist_length|default(0))|float %}
    {% set assist_speed = params.ASSIST_SPEED|default(buffer_vars.unload_assist_speed|default(18))|float %}

    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        RESPOND MSG="Buffer: Sensor already clear - filament ejected, skipping retraction"
        SET_PIN PIN=_Retract_Button VALUE=1
    {% else %}
        RESPOND MSG="Buffer: Starting retraction (timeout: {timeout|int}s, sensor checked every {segment}s)..."
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=active VALUE=True
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=retracting VALUE=True
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=time_left VALUE={timeout}
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=timeout VALUE={timeout}
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=segment VALUE={segment}
        # Disable runout event handling so clearing the sensor doesn't trigger PAUSE
        # (Demon re-enables the sensor before calling this hook). The hardware pin
        # state is still readable for polling even while event handling is disabled.
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=sensor_disabled VALUE=True
        SET_PIN PIN=_Feed_Button VALUE=1
        SET_PIN PIN=_Retract_Button VALUE=0
        {% if assist > 0 %}
            {% if printer.extruder.can_extrude %}
                # SET_PIN is timed with the move queue, so the buffer starts
                # pulling exactly as this extruder retraction begins
                RESPOND MSG="Buffer: Extruder releasing filament ({assist}mm at {assist_speed}mm/s) while buffer pulls..."
                SAVE_GCODE_STATE NAME=buffer_assist_state
                M83
                G1 E-{assist} F{(assist_speed * 60)|int}
                M400
                RESTORE_GCODE_STATE NAME=buffer_assist_state
            {% else %}
                RESPOND MSG="Buffer: Hotend below min_extrude_temp - skipping extruder assist, buffer pulling alone"
            {% endif %}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_buffer_retract_poll DURATION={segment}
    {% endif %}

[delayed_gcode _buffer_retract_poll]
# Alternates two steps (delayed_gcode templates render fresh each run):
#  - end of a retract segment: release the retract pin so the firmware
#    refreshes PB15, and come back after a short gap
#  - end of the gap: stop if the sensor reads clear or time is up,
#    otherwise start the next retract segment
gcode:
    {% set state = printer["gcode_macro _Buffer_Retract_State"] %}
    {% set refresh_gap = 0.25 %}  # seconds the retract signal is released; firmware needs one loop pass
    {% set retracted = (state.timeout - state.time_left)|round(1) %}
    {% if not state.active %}
        # Cancelled by BUFFER_STOP or already finished — do nothing
    {% elif state.retracting %}
        SET_PIN PIN=_Retract_Button VALUE=1
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=retracting VALUE=False
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=time_left VALUE={state.time_left - state.segment}
        UPDATE_DELAYED_GCODE ID=_buffer_retract_poll DURATION={refresh_gap}
    {% elif not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=active VALUE=False
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=sensor_disabled VALUE=False
        RESPOND MSG="✓ Buffer: Filament ejected - retraction complete ({retracted}s of retraction)"
    {% elif state.time_left <= 0 %}
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=active VALUE=False
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=sensor_disabled VALUE=False
        RESPOND MSG="⚠ Buffer: Timeout reached after {retracted}s - check filament manually"
    {% else %}
        SET_PIN PIN=_Retract_Button VALUE=0
        SET_GCODE_VARIABLE MACRO=_Buffer_Retract_State VARIABLE=retracting VALUE=True
        UPDATE_DELAYED_GCODE ID=_buffer_retract_poll DURATION={state.segment}
    {% endif %}


#####################################################################
# Buffer_Assert_Filament_Detected - Pre-load filament sensor guard
#####################################################################
# Checks that filament is in the buffer before a load operation begins.
# The sensor is the buffer's INLET switch, so this only proves filament
# has been inserted - not that the buffer has finished feeding it to the
# extruder gears. Raises a clear error if no filament is detected.
#
# Called by Demon Klipper Essentials _CUSTOM_PRE_LOAD and
# _CUSTOM_PRE_LOAD_CLEAN hooks in demon_custom_expansion.cfg.
# Also usable standalone before any manual load sequence.
#
# Note: Uses action_raise_error() — NOT ABORT. ABORT is not a Klipper
# command: it only prints 'Unknown command' and the caller keeps running.
# action_raise_error() fires while the template renders, so no other line
# of this macro runs - all user guidance must be in the error text itself.
#####################################################################

[gcode_macro Buffer_Assert_Filament_Detected]
description: Assert filament is in the buffer (inlet sensor) before load. Errors if not detected.
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        RESPOND MSG="Buffer: Filament detected in buffer - ready for load"
    {% else %}
        { action_raise_error("Buffer: No filament in buffer. Insert filament into the buffer, wait for it to auto-feed to the extruder, then run LOAD_FILAMENT again.") }
    {% endif %}
