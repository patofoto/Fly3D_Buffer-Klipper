#####################################################################
# FLY-LLL PLUS Buffer — Demon Klipper Essentials Integration Snippet
#####################################################################
#
# !! THIS FILE IS A REFERENCE SNIPPET — DO NOT INCLUDE IT DIRECTLY !!
#
# Klipper merges config sections with the same name, so including this
# file would silently replace the hook macros in your Demon expansion
# file (whichever is included last wins). Don't include it, and don't
# use a wildcard like [include ./Fly3D_Buffer/*.cfg] - include
# mellow_buffer_klipper.cfg and mellow_buffer_macros.cfg explicitly.
#
# Instead, copy the relevant sections below into YOUR printer's Demon
# expansion file (the name includes Demon's version number):
#   ~/printer_data/config/Demon_User_Files/demon_custom_expansion_v*.cfg
# Demon updates can replace that file with empty hooks - re-check the
# hooks after updating Demon.
#
# What this does:
#   LOAD_FILAMENT   → pre-load hook checks there is filament in the
#                     buffer (and no retraction still running) before
#                     Demon heats and loads. Aborts with a clear message.
#   UNLOAD_FILAMENT → post-unload hook releases the filament from the
#                     extruder while the buffer pulls, then the buffer
#                     retracts until the filament clears its inlet.
#
# Prerequisites:
#   mellow_buffer_klipper.cfg and mellow_buffer_macros.cfg included in
#   printer.cfg (include order doesn't matter), and these Demon settings
#   in Demon_User_Files/demon_user_settings_v*.cfg - values are for a
#   Stealthburner/Galileo 2 with a Revo (100mm nozzle tip to gears):
#     variable_load_length: 80         # fast move stops before the melt zone
#     variable_load_purge_length: 70   # rest of the path + ~50mm purge, at 7mm/s
#     variable_unload_length: 20       # see the post-unload notes below
#     variable_max_extrude_speed: 7    # purge speed the hotend can melt
#                                      # (Demon warns below 15 - harmless)
#
# How Demon hooks work:
#   Each hook macro has a matching enable flag in
#   _CUSTOM_EXPANSION_ACTIVE_LIST. Both the master enable AND the
#   per-hook flag must be True for the hook to run.
#
#####################################################################


#####################################################################
# STEP 1 — Enable hooks in _CUSTOM_EXPANSION_ACTIVE_LIST
#####################################################################
# In your demon_custom_expansion_v*.cfg, find _CUSTOM_EXPANSION_ACTIVE_LIST
# and change these four lines from False to True:
#
#   variable_pre_load:          True   # was False
#   variable_post_unload:       True   # was False
#   variable_pre_load_clean:    True   # was False
#   variable_post_unload_clean: True   # was False  ← easy to miss, separate from post_unload
#
# Also confirm the master switch is on (it usually is by default):
#   variable_ceal_master_enable: True
#####################################################################


#####################################################################
# STEP 2 — Fill in the hook macro bodies
#####################################################################
# Copy each macro body below into the matching empty macro stub in
# your demon_custom_expansion.cfg.
#####################################################################


# --- Pre-load hook (LOAD_FILAMENT) ----------------------------------
# Runs BEFORE Demon heats the hotend and engages the extruder.
# Checks that the buffer has already auto-fed filament to the extruder.
# If not ready, aborts with instructions — user inserts filament,
# waits for buffer to auto-feed (HALL sensor triggers firmware), then
# retries LOAD_FILAMENT.

[gcode_macro _CUSTOM_PRE_LOAD]
gcode:
    Buffer_Assert_Filament_Detected


# --- Post-unload hook (UNLOAD_FILAMENT) -----------------------------
# Runs AFTER Demon's full unload sequence completes.
#
# The buffer does NOT follow the extruder when it pushes filament back,
# so a long extruder-only retraction bunches filament up in the PTFE, the
# extruder slips, and the end stays in the gears (it snaps free when the
# buffer later pulls). So Demon should only shape the tip and pull the
# filament out of the hot zone, and the rest happens here with both motors:
#
#   Demon settings:  variable_unload_length: 20
#       (tip shaping nets ~32mm, so the end stops ~52mm above the nozzle,
#        still gripped by the gears, out of the melt zone)
#   Buffer settings: variable_unload_assist_length: 90
#                    variable_unload_assist_speed: 18
#       (assist speed ~80% of the buffer's: 18 at the stock 260 RPM,
#        28 if the buffer is set to 400 RPM with `speed 400`)
#       (Buffer_Retract_Until_Runout starts the buffer and retracts the
#        extruder 90mm at the same time, slightly slower than the buffer,
#        so the end leaves the gears taut; the buffer then continues
#        alone until the inlet switch clears - about 60s through 1.3m)

[gcode_macro _CUSTOM_POST_UNLOAD]
gcode:
    Buffer_Retract_Until_Runout TIMEOUT=90 POLL=2.0


# --- Pre-load-clean hook (LOAD_CLEAN) --------------------------------
# LOAD_CLEAN = LOAD_FILAMENT + nozzle cleaning. Same pre-load check
# applies: filament must be at the extruder before Demon engages.

[gcode_macro _CUSTOM_PRE_LOAD_CLEAN]
gcode:
    Buffer_Assert_Filament_Detected


# --- Post-unload-clean hook (UNLOAD_CLEAN) ---------------------------
# UNLOAD_CLEAN = nozzle clean + UNLOAD_FILAMENT. Same logic applies —
# Demon's _CLEAN_UNLOADER handles extruder retraction before this hook
# fires. Buffer just needs to pull the tail clear.

[gcode_macro _CUSTOM_POST_UNLOAD_CLEAN]
gcode:
    Buffer_Retract_Until_Runout TIMEOUT=90 POLL=2.0
